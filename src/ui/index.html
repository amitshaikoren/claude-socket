<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-socket</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d10;
    --panel: #14161b;
    --panel-2: #1a1d24;
    --line: #262a33;
    --text: #e6e8ec;
    --dim: #878d9a;
    --accent: #d97757;
    --green: #62b57a;
    --blue: #6ba7d9;
    --purple: #a98bd4;
    --red: #d96b6b;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

    /* Chart series: slots 1-3 of the documented categorical palette, stepped for
       a dark surface. Validated against --panel (#14161b): worst adjacent CVD
       ΔE 9.4, normal-vision ΔE 26.5, all three over 3:1 contrast. The header's
       decorative --blue/--purple/--green are NOT usable here; blue and purple
       collapse to ΔE 1.3 under deuteranopia. */
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .spacer { flex: 1; }
  input[type=password], input[type=text], input[type=search], select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font: 12px var(--mono); max-width: 340px;
  }
  input[type=password], input[type=text] { width: 240px; }
  .hidden { display: none !important; }
  .authnote { font: 11px var(--mono); color: var(--dim); }
  .authnote b { color: var(--green); font-weight: 500; }
  button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }

  /* tabs */
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button {
    background: none; border: 1px solid transparent; border-radius: 6px;
    color: var(--dim); padding: 6px 14px; font-size: 13px;
  }
  nav.tabs button[aria-selected="true"] {
    background: var(--panel-2); border-color: var(--line); color: var(--text);
  }

  main { padding: 20px; }
  .cols { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) { .cols { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card > h2 {
    margin: 0; padding: 11px 16px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .card > h2 .sub { text-transform: none; letter-spacing: 0; font-size: 11px; }
  /* Hairlines ride on the tiles, not on a background showing through the gaps:
     a partly-filled last row would otherwise leave a lit block of --line where
     the missing tiles are. */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
    background: var(--panel);
    /* Pull the outer hairlines under the card's own border and the header rule,
       so the edges read as one line rather than two. */
    margin: -1px -1px 0 0;
  }
  .stat {
    background: var(--panel); padding: 12px 16px;
    border-right: 1px solid var(--line); border-top: 1px solid var(--line);
  }
  /* Proportional figures: tabular-nums makes a standalone 121 look loose. */
  .stat .v { font: 600 20px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .stat .k { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .stat.cost .v { color: var(--accent); }
  .stat.saved .v { color: var(--green); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 500; color: var(--dim); padding: 8px 16px; font-size: 11px; }
  td { padding: 8px 16px; border-top: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.wrap { font-family: inherit; font-variant-numeric: normal; }
  th.num, td.num { text-align: right; }
  tr:hover td { background: var(--panel-2); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px;
         font-family: var(--mono); border: 1px solid; }
  .tag.oracle { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
  .tag.harness { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 40%, transparent); }
  .tag.semi { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
  .tag.busy { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .kill { color: var(--dim); cursor: pointer; border: none; background: none; padding: 0 4px; }
  .kill:hover { color: var(--red); }
  #feed { max-height: 62vh; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
  .ev { padding: 7px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .ev:first-child { border-top: none; }
  .ev .t { color: var(--dim); font-size: 11px; flex-shrink: 0; }
  .ev .type { flex-shrink: 0; width: 62px; font-size: 11px; }
  .ev .body { min-width: 0; word-break: break-word; }
  .ev.turn .type { color: var(--green); }
  .ev.request .type { color: var(--blue); }
  .ev.tool .type { color: var(--purple); }
  .ev.session .type { color: var(--dim); }
  .ev.error .type { color: var(--red); }
  .ev .meta { color: var(--dim); }
  .ev .q { color: var(--text); }
  .ev .a { color: var(--green); }
  .empty { padding: 24px 16px; color: var(--dim); font-size: 13px; text-align: center; }

  /* ── usage tab ───────────────────────────────────────────────────────── */

  /* One filter row above everything it scopes; never inside a chart card. */
  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px;
  }
  .filters label { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .filters select, .filters input { font-size: 12px; }
  .stack { display: flex; flex-direction: column; gap: 20px; }

  .chartwrap { padding: 16px; }
  /* Sized to include the x-axis band, so the card never grows a nested scroll. */
  .chartwrap svg { display: block; width: 100%; height: auto; }
  .fade { opacity: .55; transition: opacity .15s; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; color: var(--dim); }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--text); font-weight: 500; }

  #tip {
    position: fixed; z-index: 60; display: none; max-width: 340px; pointer-events: none;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; box-shadow: 0 8px 28px #000a;
  }
  #tip .h { font-weight: 600; margin-bottom: 6px; }
  #tip table { font-size: 11px; }
  #tip td { border: none; padding: 2px 0; font-family: var(--mono); }
  #tip td:first-child { padding-right: 14px; color: var(--dim); font-family: inherit; }
  #tip .note { color: var(--dim); font-size: 10px; margin-top: 6px; }

  .bar:hover, .hitbox:hover + .bar { filter: brightness(1.18); }
  .axis { font-size: 10px; fill: var(--dim); font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--line); stroke-width: 1; }

  tr.turnrow { cursor: pointer; }
  tr.turnrow td:first-child::before { content: "▸ "; color: var(--dim); }
  tr.turnrow.open td:first-child::before { content: "▾ "; }
  tr.detail > td { background: var(--bg); padding: 0 16px 12px 32px; }
  tr.detail table { font-size: 11px; }
  tr.detail th { padding: 6px 8px; }
  tr.detail td { padding: 5px 8px; }
  .scroll { overflow-x: auto; }
  /* The turn list can run to hundreds of rows; letting it grow would push the
     charts off the top of a page nobody scrolls back up. */
  #u-turns { max-height: 60vh; overflow: auto; }
  #u-turns thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .prompt { color: var(--text); }
  .reply { color: var(--dim); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>claude<span>-socket</span></h1>
  <nav class="tabs" role="tablist">
    <button id="tab-live" role="tab" aria-selected="true">Live</button>
    <button id="tab-usage" role="tab" aria-selected="false">Usage</button>
  </nav>
  <span class="meta" id="mode" style="color:var(--dim);font:12px var(--mono)"></span>
  <span class="spacer"></span>
  <span class="authnote hidden" id="authnote"></span>
  <select id="tokenPick" class="hidden" title="API tokens this server accepts"></select>
  <button id="copy" class="hidden" title="Copy token">Copy</button>
  <input type="password" id="token" class="hidden" placeholder="API token" autocomplete="off" />
  <button id="connect" class="hidden">Connect</button>
  <button id="clear">Clear feed</button>
</header>

<div id="tip"></div>

<main>
  <section id="view-live">
    <div class="cols">
      <div class="stack" style="min-width:0">
        <div class="card">
          <h2>Totals <span class="sub">since this server started</span></h2>
          <div class="stats" id="stats"></div>
        </div>
        <div class="card">
          <h2>Live sessions <span id="sesscount" style="color:var(--dim)"></span></h2>
          <div id="sessions"><div class="empty">none</div></div>
        </div>
      </div>

      <div class="card" style="min-width:0">
        <h2>Activity</h2>
        <div id="feed"><div class="empty">connecting…</div></div>
      </div>
    </div>
  </section>

  <section id="view-usage" class="hidden">
    <div class="filters">
      <label>Window
        <select id="f-window">
          <option value="1h">last hour</option>
          <option value="24h" selected>last 24h</option>
          <option value="7d">last 7 days</option>
          <option value="30d">last 30 days</option>
          <option value="">all time</option>
        </select>
      </label>
      <label>Mode <select id="f-mode"><option value="">all</option></select></label>
      <label>Model <select id="f-model"><option value="">all</option></select></label>
      <label>Tool <select id="f-tool"><option value="">all</option></select></label>
      <label>Status
        <select id="f-status">
          <option value="">all</option>
          <option value="ok">ok</option>
          <option value="error">errors</option>
        </select>
      </label>
      <label>Bucket
        <select id="f-bucket">
          <option value="minute">minute</option>
          <option value="hour" selected>hour</option>
          <option value="day">day</option>
        </select>
      </label>
      <label>Search <input type="search" id="f-q" placeholder="prompt or reply" style="width:180px" /></label>
      <span class="spacer"></span>
      <button id="f-reset">Reset</button>
    </div>

    <div class="stack">
      <div class="card">
        <h2>Summary <span class="sub" id="u-range"></span></h2>
        <div class="stats" id="u-stats"></div>
      </div>

      <div class="card">
        <h2>
          Billed tokens over time
          <span class="spacer"></span>
          <select id="c-metric" style="font-size:11px">
            <option value="tokens" selected>token split</option>
            <option value="cost">cost</option>
            <option value="turns">turns</option>
            <option value="peak">peak context</option>
          </select>
          <button id="c-table" style="font-size:11px">Table</button>
        </h2>
        <div class="chartwrap" id="c-series"></div>
      </div>

      <div class="card">
        <h2>Tokens by tool <span class="sub">what the agent's own tools cost</span></h2>
        <div class="chartwrap" id="c-tools"></div>
      </div>

      <div class="card">
        <h2>Turns <span class="sub" id="u-count"></span></h2>
        <div class="scroll" id="u-turns"><div class="empty">no turns in this window</div></div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = window.localStorage;
  const tokenInput = $("token");
  const tokenPick = $("tokenPick");

  let source = null;
  let poller = null;

  // The active credential: whichever the server handed us, or one typed in.
  const currentToken = () =>
    (tokenPick.classList.contains("hidden") ? tokenInput.value : tokenPick.value).trim();

  const fmt = {
    num: (n) => (n ?? 0).toLocaleString(),
    /** Auto-compact, for stat tiles and axis ticks. */
    compact: (n) => {
      const v = Number(n ?? 0);
      const a = Math.abs(v);
      if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, "") + "B";
      if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
      if (a >= 1e4) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
      return v.toLocaleString();
    },
    usd: (n) => "$" + (n ?? 0).toFixed(4),
    usdShort: (n) => "$" + (n ?? 0).toFixed(n >= 10 ? 0 : 2),
    time: (ms) => new Date(ms).toLocaleTimeString([], { hour12: false }),
    dur: (ms) => {
      const s = Math.round(ms / 1000);
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
      return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
    },
  };

  const esc = (s) => String(s ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

  const auth = () => "api_key=" + encodeURIComponent(currentToken());

  async function api(path, options = {}) {
    const sep = path.includes("?") ? "&" : "?";
    const res = await fetch(path + sep + auth(), options);
    if (!res.ok) throw new Error(path + " -> " + res.status);
    return res.json();
  }

  // ── live tab ──────────────────────────────────────────────────────────

  function renderStats(data) {
    const t = data.totals;
    // Billed leads: it is what the run actually cost at full rate. Cache reads
    // are shown beside it as the saving, never added into the headline.
    const cards = [
      ["Billed tok", fmt.compact(t.headline), ""],
      ["Cost", fmt.usd(t.costUsd), "cost"],
      ["Requests", fmt.num(t.requests), ""],
      ["Turns", fmt.num(t.turns), ""],
      ["Model calls", fmt.num(t.steps), ""],
      ["Input tok", fmt.compact(t.inputTokens), ""],
      ["Output tok", fmt.compact(t.outputTokens), ""],
      ["Cached tok", fmt.compact(t.cacheReadTokens), "saved"],
      ["Peak ctx", fmt.compact(t.peakContext), ""],
      ["Agent tools", fmt.num(t.agentToolCalls), ""],
      ["Client tools", fmt.num(t.toolCalls), ""],
      ["Errors", fmt.num(t.errors), ""],
      ["Uptime", fmt.dur(data.uptimeMs), ""],
    ];
    $("stats").innerHTML = cards
      .map(([k, v, cls]) => `<div class="stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`)
      .join("");

    const c = data.config;
    $("mode").textContent =
      `default ${c.defaultMode} · ${c.defaultModel} · reuse ${c.reuse ? "on" : "off"}` +
      (c.usagePersisted ? "" : " · history in memory");
  }

  function renderSessions(list) {
    $("sesscount").textContent = list.length ? `(${list.length})` : "";
    if (!list.length) {
      $("sessions").innerHTML = '<div class="empty">none</div>';
      return;
    }
    const rows = list.map((s) => {
      // Codex has no tool list; its sandbox answers the same question, and
      // showing "all" for it would claim something untrue in both directions.
      const tools = s.sandbox ? `sandbox: ${s.sandbox}` : s.tools ? s.tools.join(", ") : "all";
      return `
      <tr>
        <td title="${esc(s.sessionId)}">${esc((s.sessionId || "").slice(0, 8))}</td>
        <td><span class="tag ${s.mode}">${s.mode}</span></td>
        <td class="wrap" title="${esc(tools)}" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)">${esc(tools)}</td>
        <td class="num">${s.turns}</td>
        <td class="num">${fmt.usd(s.costUsd)}</td>
        <td>${s.busy ? '<span class="tag busy">busy</span>' : s.idleSeconds + "s"}</td>
        <td><button class="kill" data-id="${esc(s.sessionId)}" title="Terminate">✕</button></td>
      </tr>`;
    }).join("");
    $("sessions").innerHTML =
      `<table><thead><tr><th>id</th><th>mode</th><th>tools</th><th class="num">turns</th><th class="num">cost</th><th>idle</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;

    for (const btn of $("sessions").querySelectorAll(".kill")) {
      btn.onclick = async () => {
        try {
          await api("/admin/sessions/" + encodeURIComponent(btn.dataset.id), { method: "DELETE" });
          refresh();
        } catch (err) { console.error(err); }
      };
    }
  }

  function line(ev) {
    const body = (() => {
      switch (ev.type) {
        case "request":
          return `<span class="meta">${esc(ev.model || "-")} ${ev.stream ? "stream" : "sync"}${ev.tools ? " tools:" + ev.tools : ""}</span>`;
        case "turn":
          return `<span class="q">${esc(ev.prompt)}</span> <span class="meta">→</span> <span class="a">${esc(ev.reply)}</span>` +
            `<div class="meta">${ev.mode} · billed ${fmt.num(ev.headline)}` +
            ` (in ${fmt.num(ev.inputTokens)} · out ${fmt.num(ev.outputTokens)})` +
            (ev.cacheReadTokens ? ` · ${fmt.num(ev.cacheReadTokens)} cached` : "") +
            (ev.steps > 1 ? ` · ${ev.steps} model calls` : "") +
            (ev.agentToolCalls ? ` · ${ev.agentToolCalls} agent tool(s)` : "") +
            (ev.toolCalls ? ` · ${ev.toolCalls} client tool(s)` : "") +
            ` · ${fmt.usd(ev.costUsd)}</div>`;
        case "tool":
          return `<span class="meta">${esc(ev.summary || ev.name)}</span>`;
        case "session":
          return `<span class="meta">${ev.action} ${esc((ev.sessionId || "").slice(0, 8))} ${ev.mode || ""} ${ev.reason ? "(" + ev.reason + ")" : ""}</span>`;
        case "error":
          return `<span style="color:var(--red)">${esc(ev.message || ev.errorType || "error")}</span>`;
        default:
          return "";
      }
    })();

    const el = document.createElement("div");
    el.className = "ev " + ev.type;
    el.innerHTML = `<span class="t">${fmt.time(ev.at)}</span><span class="type">${ev.type}</span><span class="body">${body}</span>`;
    return el;
  }

  function push(ev) {
    const feed = $("feed");
    if (feed.querySelector(".empty")) feed.innerHTML = "";
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    feed.appendChild(line(ev));
    while (feed.children.length > 400) feed.removeChild(feed.firstChild);
    if (atBottom) feed.scrollTop = feed.scrollHeight;
    if (ev.type === "turn" || ev.type === "session") {
      refresh();
      // A finished turn changes the history too, but only redraw the tab in view.
      if (ev.type === "turn" && !$("view-usage").classList.contains("hidden")) loadUsage();
    }
  }

  let refreshQueued = false;
  async function refresh() {
    if (refreshQueued) return;
    refreshQueued = true;
    setTimeout(async () => {
      refreshQueued = false;
      try {
        const data = await api("/admin/stats");
        renderStats(data);
        renderSessions(data.sessions);
        $("dot").classList.add("live");
        const empty = $("feed").querySelector(".empty");
        if (empty) empty.textContent = "connected — waiting for traffic";
      } catch {
        $("dot").classList.remove("live");
      }
    }, 120);
  }

  // ── charts ────────────────────────────────────────────────────────────

  const SURFACE = "#14161b";           // the card the charts sit on
  const SERIES = {
    input:  { key: "inputTokens",         label: "Input",          color: "var(--s1)", hex: "#3987e5" },
    create: { key: "cacheCreationTokens", label: "Cache creation", color: "var(--s2)", hex: "#d95926" },
    output: { key: "outputTokens",        label: "Output",         color: "var(--s3)", hex: "#199e70" },
  };

  /**
   * Clean tick values whose last tick is always >= max.
   *
   * The top tick is the scale the bars are drawn against, so it must cover the
   * data: stopping at the last tick below max silently scales every bar past
   * the plot, and the tall ones render off the edge with their labels cut off.
   */
  function niceTicks(max, count = 4) {
    if (!(max > 0)) return [0, 1];
    const raw = max / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
    const out = [];
    for (let v = 0; v < max - step * 1e-9; v += step) out.push(v);
    out.push(out.length ? out[out.length - 1] + step : step);
    return out;
  }

  /**
   * A bar with rounded corners at the data end only, square at the baseline.
   * `round` is false for the interior segments of a stack, which have no free end.
   */
  function barPath(x, y, w, h, r, round) {
    if (h <= 0) return "";
    const rad = round ? Math.min(r, w / 2, h) : 0;
    return `M${x},${y + h}L${x},${y + rad}Q${x},${y} ${x + rad},${y}` +
           `L${x + w - rad},${y}Q${x + w},${y} ${x + w},${y + rad}L${x + w},${y + h}Z`;
  }

  const tip = $("tip");
  function showTip(event, html) {
    tip.innerHTML = html;
    tip.style.display = "block";
    const pad = 14;
    let x = event.clientX + pad;
    let y = event.clientY + pad;
    if (x + tip.offsetWidth > innerWidth) x = event.clientX - tip.offsetWidth - pad;
    if (y + tip.offsetHeight > innerHeight) y = event.clientY - tip.offsetHeight - pad;
    tip.style.left = Math.max(4, x) + "px";
    tip.style.top = Math.max(4, y) + "px";
  }
  const hideTip = () => { tip.style.display = "none"; };
  document.addEventListener("scroll", hideTip, true);

  /** Items without a color are footnotes: they get no swatch to stand in for. */
  function legend(items) {
    return `<div class="legend">` + items.map((i) =>
      i.color
        ? `<span><i class="sw" style="background:${i.color}"></i><b>${esc(i.label)}</b>${i.note ? " " + esc(i.note) : ""}</span>`
        : `<span>${esc(i.note || i.label)}</span>`
    ).join("") + `</div>`;
  }

  /**
   * A tick label. Over a multi-day window an hour label like "14:00" repeats
   * once per day and says nothing, so the date is carried on the first tick of
   * each day and dropped on the rest.
   */
  const bucketLabel = (ms, bucket, previousMs) => {
    const d = new Date(ms);
    const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    if (bucket === "day") return d.toLocaleDateString([], { month: "short", day: "numeric" });
    const newDay = previousMs === null || new Date(previousMs).toDateString() !== d.toDateString();
    if (!newDay) return time;
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
  };

  /**
   * Stacked columns over time.
   *
   * The token split stacks input + cache creation + output — the three parts of
   * the billed headline. Cache reads are deliberately not a segment: they are
   * replayed history at a tenth of the price, and stacking them would swamp the
   * chart with tokens nobody paid full rate for. They ride in the tooltip.
   *
   * The other metrics are single-series, so they take slot 1 and no legend box.
   */
  function renderSeries(points, bucket, metric) {
    const host = $("c-series");
    if (!points.length) {
      host.innerHTML = '<div class="empty">no traffic in this window</div>';
      return;
    }

    const stacked = metric === "tokens";
    const parts = stacked ? [SERIES.input, SERIES.create, SERIES.output] : [];
    const single = { cost: "costUsd", turns: "turns", peak: "peakContext" }[metric];
    const isCost = metric === "cost";

    const total = (p) => stacked
      ? parts.reduce((a, s) => a + (p[s.key] || 0), 0)
      : (p[single] || 0);

    const W = Math.max(host.clientWidth || 800, 320);
    const padL = 56, padR = 16, padT = 14, padB = 30;
    const H = 240;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    const max = Math.max(...points.map(total), isCost ? 0.0001 : 1);
    const ticks = niceTicks(max);
    const top = ticks[ticks.length - 1] || max;
    const yOf = (v) => padT + plotH - (v / top) * plotH;

    const slot = plotW / points.length;
    const bw = Math.min(24, Math.max(3, slot - 6));   // capped: never fill the slot
    const GAP = 2;                                    // surface gap between segments

    let marks = "";
    points.forEach((p, i) => {
      const x = padL + slot * i + (slot - bw) / 2;
      const value = total(p);

      if (stacked) {
        // Bottom-up, so the rounded cap lands on the topmost non-empty segment.
        const present = parts.filter((s) => (p[s.key] || 0) > 0);
        let cursor = padT + plotH;
        present.forEach((s, j) => {
          const raw = ((p[s.key] || 0) / top) * plotH;
          const isTop = j === present.length - 1;
          const h = Math.max(1, raw - (isTop ? 0 : GAP));
          const y = cursor - raw;
          marks += `<path class="bar" d="${barPath(x, y, bw, h, 4, isTop)}" fill="${s.color}"/>`;
          cursor -= raw;
        });
      } else {
        const h = Math.max(value > 0 ? 1 : 0, (value / top) * plotH);
        marks += `<path class="bar" d="${barPath(x, yOf(value), bw, h, 4, true)}" fill="${SERIES.input.color}"/>`;
      }

      // Hit area spans the whole slot and the full height: a 3px column is
      // impossible to hover, and the target should never be the mark itself.
      marks += `<rect class="hitbox" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${plotH}"
        fill="transparent" data-i="${i}"><title></title></rect>`;
    });

    let grid = "";
    for (const t of ticks) {
      const y = yOf(t);
      grid += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>` +
        `<text class="axis" x="${padL - 8}" y="${y + 3}" text-anchor="end">${isCost ? fmt.usdShort(t) : fmt.compact(t)}</text>`;
    }

    // Thin x labels so they never collide; a dated label needs more room.
    const every = Math.max(1, Math.ceil(points.length / Math.max(1, Math.floor(plotW / 86))));
    let xlab = "";
    let lastLabelled = null;
    points.forEach((p, i) => {
      if (i % every) return;
      xlab += `<text class="axis" x="${padL + slot * i + slot / 2}" y="${H - 10}" text-anchor="middle">${esc(bucketLabel(p.bucket, bucket, lastLabelled))}</text>`;
      lastLabelled = p.bucket;
    });

    host.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Billed tokens over time">${grid}${marks}${xlab}</svg>` +
      (stacked
        ? legend([
            { color: SERIES.input.color, label: "Input" },
            { color: SERIES.create.color, label: "Cache creation" },
            { color: SERIES.output.color, label: "Output" },
            { note: "cache reads excluded — replayed history, billed at ~10%" },
          ])
        : "");

    for (const box of host.querySelectorAll(".hitbox")) {
      const p = points[Number(box.dataset.i)];
      box.addEventListener("mousemove", (e) => showTip(e, seriesTip(p, bucket, stacked, metric)));
      box.addEventListener("mouseleave", hideTip);
    }
  }

  function seriesTip(p, bucket, stacked, metric) {
    const when = new Date(p.bucket).toLocaleString([], {
      month: "short", day: "numeric",
      hour: bucket === "day" ? undefined : "2-digit",
      minute: bucket === "day" ? undefined : "2-digit",
      hour12: false,
    });
    const rows = stacked
      ? [
          ["Input", fmt.num(p.inputTokens)],
          ["Cache creation", fmt.num(p.cacheCreationTokens)],
          ["Output", fmt.num(p.outputTokens)],
          ["Billed", "<b>" + fmt.num(p.headline) + "</b>"],
          ["Cache read", fmt.num(p.cacheReadTokens)],
          ["Turns", fmt.num(p.turns)],
          ["Cost", fmt.usd(p.costUsd)],
        ]
      : metric === "cost"
        ? [["Cost", "<b>" + fmt.usd(p.costUsd) + "</b>"], ["Turns", fmt.num(p.turns)], ["Billed", fmt.num(p.headline)]]
        : metric === "turns"
          ? [["Turns", "<b>" + fmt.num(p.turns) + "</b>"], ["Billed", fmt.num(p.headline)], ["Cost", fmt.usd(p.costUsd)]]
          : [["Peak context", "<b>" + fmt.num(p.peakContext) + "</b>"], ["Turns", fmt.num(p.turns)]];

    return `<div class="h">${esc(when)}</div><table>` +
      rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") +
      `</table>` + (stacked ? `<div class="note">Cache reads are excluded from Billed.</div>` : "");
  }

  /** The same numbers as a table — every chart needs a WCAG-clean twin. */
  function renderSeriesTable(points, bucket) {
    const host = $("c-series");
    if (!points.length) {
      host.innerHTML = '<div class="empty">no traffic in this window</div>';
      return;
    }
    const rows = points.map((p) => `<tr>
      <td class="wrap">${esc(new Date(p.bucket).toLocaleString([], { hour12: false }))}</td>
      <td class="num">${fmt.num(p.turns)}</td>
      <td class="num">${fmt.num(p.inputTokens)}</td>
      <td class="num">${fmt.num(p.cacheCreationTokens)}</td>
      <td class="num">${fmt.num(p.outputTokens)}</td>
      <td class="num"><b>${fmt.num(p.headline)}</b></td>
      <td class="num">${fmt.num(p.cacheReadTokens)}</td>
      <td class="num">${fmt.num(p.peakContext)}</td>
      <td class="num">${fmt.usd(p.costUsd)}</td>
    </tr>`).join("");
    host.innerHTML = `<div class="scroll"><table>
      <thead><tr><th>${bucket}</th><th class="num">turns</th><th class="num">input</th>
      <th class="num">cache create</th><th class="num">output</th><th class="num">billed</th>
      <th class="num">cache read</th><th class="num">peak ctx</th><th class="num">cost</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  /**
   * Tokens per tool, as horizontal stacked bars.
   *
   * Two segments per tool: the output spent asking for the call, and the input
   * spent reading its result back on the next model call. Both halves are
   * apportioned across the calls in a step — the API bills a call, not a block —
   * so the split is an attribution, which the footnote says out loud.
   */
  function renderTools(tools) {
    const host = $("c-tools");
    if (!tools.length) {
      host.innerHTML = '<div class="empty">no agent tool calls in this window — oracle turns run no tools</div>';
      return;
    }

    const rows = tools.slice(0, 12);
    const W = Math.max(host.clientWidth || 800, 320);
    // The name gutter and the tip-label margin scale down, so a narrow viewport
    // still leaves the bars most of the width.
    const padL = Math.round(Math.min(120, Math.max(62, W * 0.17)));
    const padR = Math.round(Math.min(74, Math.max(46, W * 0.09)));
    const padT = 6, padB = 24;
    const rowH = 30, bh = 18, GAP = 2;
    const H = padT + rows.length * rowH + padB;
    const plotW = W - padL - padR;
    const max = Math.max(...rows.map((t) => t.totalTokens), 1);
    const ticks = niceTicks(max, 3);
    const top = ticks[ticks.length - 1] || max;

    let grid = "";
    for (const t of ticks) {
      const x = padL + (t / top) * plotW;
      grid += `<line class="gridline" x1="${x}" y1="${padT}" x2="${x}" y2="${padT + rows.length * rowH}"/>` +
        `<text class="axis" x="${x}" y="${H - 8}" text-anchor="middle">${fmt.compact(t)}</text>`;
    }

    let marks = "";
    rows.forEach((t, i) => {
      const y = padT + i * rowH + (rowH - bh) / 2;
      const reqW = (t.requestTokens / top) * plotW;
      const resW = (t.resultTokens / top) * plotW;
      const hasResult = resW > 0;

      // Request first, then result; only the outer end is rounded.
      marks += `<path class="bar" fill="${SERIES.input.color}"
        d="${hbar(padL, y, Math.max(hasResult ? reqW - GAP : reqW, t.requestTokens > 0 ? 1 : 0), bh, 4, !hasResult)}"/>`;
      if (hasResult) {
        marks += `<path class="bar" fill="${SERIES.create.color}"
          d="${hbar(padL + reqW, y, Math.max(resW, 1), bh, 4, true)}"/>`;
      }

      marks += `<text class="axis" x="${padL - 10}" y="${y + bh / 2 + 3}" text-anchor="end" style="fill:var(--text);font-size:11px">${esc(t.name)}</text>`;
      // Direct label at the tip — the value the reader is here for.
      marks += `<text class="axis" x="${padL + reqW + resW + 8}" y="${y + bh / 2 + 3}">${fmt.compact(t.totalTokens)}</text>`;
      marks += `<rect class="hitbox" x="0" y="${padT + i * rowH}" width="${W}" height="${rowH}" fill="transparent" data-i="${i}"/>`;
    });

    host.innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens by tool">${grid}${marks}</svg>` +
      legend([
        { color: SERIES.input.color, label: "Requesting the call", note: "(output tokens)" },
        { color: SERIES.create.color, label: "Reading the result", note: "(input on the next call)" },
      ]);

    for (const box of host.querySelectorAll(".hitbox")) {
      const t = rows[Number(box.dataset.i)];
      box.addEventListener("mousemove", (e) => showTip(e,
        `<div class="h">${esc(t.name)}</div><table>
          <tr><td>Calls</td><td>${fmt.num(t.calls)}</td></tr>
          <tr><td>In turns</td><td>${fmt.num(t.turns)}</td></tr>
          <tr><td>Requesting</td><td>${fmt.num(t.requestTokens)}</td></tr>
          <tr><td>Reading result</td><td>${fmt.num(t.resultTokens)}</td></tr>
          <tr><td>Total</td><td><b>${fmt.num(t.totalTokens)}</b></td></tr>
          <tr><td>Per call</td><td>${fmt.num(Math.round(t.totalTokens / Math.max(t.calls, 1)))}</td></tr>
        </table><div class="note">Apportioned across the calls in each model step.</div>`));
      box.addEventListener("mouseleave", hideTip);
    }
  }

  /** Horizontal bar path: rounded at the right (data) end only. */
  function hbar(x, y, w, h, r, round) {
    if (w <= 0) return "";
    const rad = round ? Math.min(r, h / 2, w) : 0;
    return `M${x},${y}L${x + w - rad},${y}Q${x + w},${y} ${x + w},${y + rad}` +
           `L${x + w},${y + h - rad}Q${x + w},${y + h} ${x + w - rad},${y + h}L${x},${y + h}Z`;
  }

  // ── usage tab ─────────────────────────────────────────────────────────

  let usageState = { points: [], tools: [], bucket: "hour", asTable: false, open: new Set() };

  function usageQuery() {
    const params = new URLSearchParams();
    const add = (k, id) => { const v = $(id).value.trim(); if (v) params.set(k, v); };
    add("window", "f-window");
    add("mode", "f-mode");
    add("model", "f-model");
    add("tool", "f-tool");
    add("status", "f-status");
    add("q", "f-q");
    return params.toString();
  }

  function fillFacets(facets) {
    const fill = (id, values) => {
      const el = $(id);
      const chosen = el.value;
      el.innerHTML = '<option value="">all</option>' +
        values.map((v) => `<option value="${esc(v)}"${v === chosen ? " selected" : ""}>${esc(v)}</option>`).join("");
    };
    fill("f-mode", facets.modes);
    fill("f-model", facets.models);
    fill("f-tool", facets.tools);
  }

  function renderUsageStats(s) {
    const cards = [
      ["Billed tok", fmt.compact(s.headline), ""],
      ["Cost", fmt.usd(s.costUsd), "cost"],
      ["Turns", fmt.num(s.turns), ""],
      ["Model calls", fmt.num(s.steps), ""],
      ["Agent tools", fmt.num(s.toolCalls), ""],
      ["Input tok", fmt.compact(s.inputTokens), ""],
      ["Cache create", fmt.compact(s.cacheCreationTokens), ""],
      ["Output tok", fmt.compact(s.outputTokens), ""],
      ["Cache read", fmt.compact(s.cacheReadTokens), "saved"],
      ["Peak ctx", fmt.compact(s.peakContext), ""],
      ["Errors", fmt.num(s.errors), ""],
      ["Tok / turn", fmt.compact(s.turns ? Math.round(s.headline / s.turns) : 0), ""],
    ];
    $("u-stats").innerHTML = cards
      .map(([k, v, cls]) => `<div class="stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`)
      .join("");

    $("u-range").textContent = s.firstAt
      ? `${new Date(s.firstAt).toLocaleString([], { hour12: false })} → ${new Date(s.lastAt).toLocaleString([], { hour12: false })}`
      : "nothing recorded yet";
  }

  function renderTurns(turns, total) {
    $("u-count").textContent = total ? `showing ${turns.length} of ${fmt.num(total)}` : "";
    if (!turns.length) {
      $("u-turns").innerHTML = '<div class="empty">no turns in this window</div>';
      return;
    }
    const rows = turns.map((t) => `
      <tr class="turnrow${usageState.open.has(t.id) ? " open" : ""}" data-id="${esc(t.id)}">
        <td class="wrap">${esc(new Date(t.at).toLocaleString([], { hour12: false }))}</td>
        <td><span class="tag ${t.mode}">${t.mode}</span></td>
        <td>${esc(t.advertisedModel)}</td>
        <td class="num"><b>${fmt.num(t.headline)}</b></td>
        <td class="num">${fmt.num(t.usage.outputTokens)}</td>
        <td class="num">${fmt.num(t.usage.cacheReadTokens)}</td>
        <td class="num">${fmt.num(t.peakContext)}</td>
        <td class="num">${fmt.usd(t.usage.costUsd)}</td>
        <td class="num">${fmt.dur(t.durationMs)}</td>
        <td class="wrap" style="max-width:340px">
          <span class="prompt">${esc(t.prompt || "—")}</span>
          ${t.ok ? "" : `<div style="color:var(--red)">${esc(t.errorMessage || "failed")}</div>`}
        </td>
      </tr>
      <tr class="detail" data-for="${esc(t.id)}" style="display:${usageState.open.has(t.id) ? "" : "none"}">
        <td colspan="10"><div class="empty">loading…</div></td>
      </tr>`).join("");

    $("u-turns").innerHTML = `<table><thead><tr>
      <th>when</th><th>mode</th><th>model</th><th class="num">billed</th><th class="num">output</th>
      <th class="num">cached</th><th class="num">peak ctx</th><th class="num">cost</th>
      <th class="num">took</th><th>prompt</th>
    </tr></thead><tbody>${rows}</tbody></table>`;

    for (const row of $("u-turns").querySelectorAll(".turnrow")) {
      row.onclick = () => toggleTurn(row.dataset.id, row);
      if (usageState.open.has(row.dataset.id)) void loadSteps(row.dataset.id);
    }
  }

  function toggleTurn(id, row) {
    const detail = $("u-turns").querySelector(`.detail[data-for="${CSS.escape(id)}"]`);
    if (!detail) return;
    if (usageState.open.has(id)) {
      usageState.open.delete(id);
      row.classList.remove("open");
      detail.style.display = "none";
      return;
    }
    usageState.open.add(id);
    row.classList.add("open");
    detail.style.display = "";
    void loadSteps(id);
  }

  /** Drill into one turn's individual model calls, and what each one ran. */
  async function loadSteps(id) {
    const detail = $("u-turns").querySelector(`.detail[data-for="${CSS.escape(id)}"]`);
    if (!detail) return;
    try {
      const data = await api(`/admin/usage/turns/${encodeURIComponent(id)}/steps`);
      if (!data.steps.length) {
        detail.firstElementChild.innerHTML =
          '<div class="empty">no per-call usage recorded for this turn</div>';
        return;
      }
      const rows = data.steps.map((s) => {
        const billed = s.usage.inputTokens + s.usage.cacheCreationTokens + s.usage.outputTokens;
        return `<tr>
          <td class="num">${s.index}</td>
          <td>${esc(s.model)}</td>
          <td class="num">${fmt.num(s.usage.inputTokens)}</td>
          <td class="num">${fmt.num(s.usage.cacheCreationTokens)}</td>
          <td class="num">${fmt.num(s.usage.outputTokens)}</td>
          <td class="num"><b>${fmt.num(billed)}</b></td>
          <td class="num">${fmt.num(s.usage.cacheReadTokens)}</td>
          <td class="wrap">${s.tools.length
            ? s.tools.map((t) => `${esc(t.name)}${t.summary ? `<span style="color:var(--dim)">(${esc(t.summary)})</span>` : ""}`).join(", ")
            : '<span style="color:var(--dim)">—</span>'}</td>
        </tr>`;
      }).join("");
      detail.firstElementChild.innerHTML = `<div class="scroll"><table>
        <thead><tr><th class="num">call</th><th>model</th><th class="num">input</th>
        <th class="num">cache create</th><th class="num">output</th><th class="num">billed</th>
        <th class="num">cache read</th><th>tools called</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    } catch (err) {
      detail.firstElementChild.innerHTML = `<div class="empty">could not load: ${esc(err.message)}</div>`;
    }
  }

  let usageBusy = false;
  let usageStale = false;

  /**
   * Refuses to run two fetches at once, but never drops the newest filter.
   * Returning early on a change made mid-flight would leave the page showing
   * the *previous* filter's data while the controls claim otherwise — change
   * window and bucket in quick succession and the bucket silently wouldn't take.
   */
  async function loadUsage() {
    if (usageBusy) {
      usageStale = true;
      return;
    }
    usageBusy = true;
    // Hold the previous render at reduced opacity rather than flashing a skeleton.
    for (const id of ["u-stats", "c-series", "c-tools", "u-turns"]) $(id).classList.add("fade");
    try {
      const query = usageQuery();
      const bucket = $("f-bucket").value;
      const [summary, series, tools, turns] = await Promise.all([
        api("/admin/usage?" + query),
        api("/admin/usage/series?bucket=" + bucket + "&" + query),
        api("/admin/usage/tools?" + query),
        api("/admin/usage/turns?limit=200&" + query),
      ]);

      fillFacets(summary.facets);
      renderUsageStats(summary.summary);

      usageState.points = series.points;
      usageState.bucket = series.bucket;
      usageState.tools = tools.tools;
      drawCharts();
      renderTurns(turns.turns, turns.total);
      $("dot").classList.add("live");
    } catch (err) {
      console.error(err);
      $("dot").classList.remove("live");
    } finally {
      usageBusy = false;
      for (const id of ["u-stats", "c-series", "c-tools", "u-turns"]) $(id).classList.remove("fade");
      if (usageStale) {
        usageStale = false;
        void loadUsage();
      }
    }
  }

  function drawSeries() {
    if (usageState.asTable) renderSeriesTable(usageState.points, usageState.bucket);
    else renderSeries(usageState.points, usageState.bucket, $("c-metric").value);
  }

  /**
   * Both charts size their viewBox from the container width, so both have to be
   * redrawn when it changes — scaling a stale wide viewBox down would shrink the
   * text along with it.
   */
  function drawCharts() {
    drawSeries();
    renderTools(usageState.tools);
  }

  // ── wiring ────────────────────────────────────────────────────────────

  function showTab(name) {
    const usage = name === "usage";
    $("view-usage").classList.toggle("hidden", !usage);
    $("view-live").classList.toggle("hidden", usage);
    $("tab-usage").setAttribute("aria-selected", String(usage));
    $("tab-live").setAttribute("aria-selected", String(!usage));
    store.setItem("socket-tab", name);
    if (usage) loadUsage();
  }

  $("tab-live").onclick = () => showTab("live");
  $("tab-usage").onclick = () => showTab("usage");

  for (const id of ["f-window", "f-mode", "f-model", "f-tool", "f-status", "f-bucket"]) {
    $(id).onchange = loadUsage;
  }
  let searchTimer = null;
  $("f-q").oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadUsage, 250);
  };
  $("f-reset").onclick = () => {
    for (const id of ["f-mode", "f-model", "f-tool", "f-status", "f-q"]) $(id).value = "";
    $("f-window").value = "24h";
    $("f-bucket").value = "hour";
    loadUsage();
  };
  $("c-metric").onchange = drawSeries;
  $("c-table").onclick = () => {
    usageState.asTable = !usageState.asTable;
    $("c-table").textContent = usageState.asTable ? "Chart" : "Table";
    $("c-metric").classList.toggle("hidden", usageState.asTable);
    drawSeries();
  };

  let resizeTimer = null;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!$("view-usage").classList.contains("hidden")) drawCharts();
    }, 150);
  });

  $("connect").onclick = connect;
  $("clear").onclick = () => { $("feed").innerHTML = '<div class="empty">connected — waiting for traffic</div>'; };
  tokenInput.onkeydown = (e) => { if (e.key === "Enter") connect(); };
  tokenPick.onchange = connect;

  $("copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(currentToken());
      $("copy").textContent = "Copied";
      setTimeout(() => ($("copy").textContent = "Copy"), 1200);
    } catch { /* clipboard blocked; the value is visible in the picker anyway */ }
  };

  function connect() {
    const token = currentToken();
    if (!token && authRequired) return;
    if (token) store.setItem("socket-token", token);

    if (source) source.close();
    if (poller) clearInterval(poller);

    // EventSource cannot set headers, hence the query-parameter credential.
    source = new EventSource("/admin/events?history=60&" + auth());
    source.onmessage = (e) => { try { push(JSON.parse(e.data)); } catch {} };
    source.onopen = () => $("dot").classList.add("live");
    source.onerror = () => $("dot").classList.remove("live");

    refresh();
    poller = setInterval(refresh, 5000);
    showTab(store.getItem("socket-tab") || "live");
  }

  let authRequired = true;

  /**
   * Ask the server who we are before showing anything. On loopback it hands
   * back the tokens it accepts, so the dashboard authenticates itself instead
   * of demanding a key the operator already has in their terminal.
   */
  async function bootstrap() {
    let info = null;
    try {
      info = await (await fetch("/admin/bootstrap")).json();
    } catch { /* fall through to manual entry */ }

    authRequired = info ? info.authRequired : true;

    if (info && !info.authRequired) {
      $("authnote").textContent = "auth disabled";
      $("authnote").classList.remove("hidden");
      connect();
      return;
    }

    if (info && info.tokens && info.tokens.length > 0) {
      tokenPick.innerHTML = info.tokens
        .map((t) => `<option value="${esc(t)}">${esc(t)}</option>`)
        .join("");

      // Prefer the token used last, when it is still one the server accepts.
      const remembered = store.getItem("socket-token");
      if (remembered && info.tokens.includes(remembered)) tokenPick.value = remembered;

      tokenPick.classList.remove("hidden");
      $("copy").classList.remove("hidden");
      $("authnote").innerHTML = `<b>auto-authenticated</b> · ${info.tokens.length} token${info.tokens.length > 1 ? "s" : ""}`;
      $("authnote").classList.remove("hidden");
      connect();
      return;
    }

    // Remote, proxied, or disclosure disabled: ask for the key.
    tokenInput.value = store.getItem("socket-token") || "";
    tokenInput.classList.remove("hidden");
    $("connect").classList.remove("hidden");
    $("authnote").textContent = info && !info.local ? "remote — token required" : "token required";
    $("authnote").classList.remove("hidden");
    if (tokenInput.value) connect();
  }

  bootstrap();
})();
</script>
</body>
</html>
